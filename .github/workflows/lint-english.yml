name: Lint English only

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  english-only:
    name: No Cyrillic in tracked text files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fail on Cyrillic characters
        env:
          LC_ALL: C.UTF-8
        run: |
          # -I skips binary files (og.png); the range is U+0400..U+04FF.
          if git grep -nIP '[\x{0400}-\x{04FF}]'; then
            echo "::error::Cyrillic text found. This repository is English only (see PROJECT.md)."
            exit 1
          fi
          echo "No Cyrillic found."
